<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="COLD READ results: gender inference accuracy versus words of text, for two language models. Llama 3.1 8B clears chance at 50 words; Qwen 2.5 7B needs 800 words. The star sign control never leaves its floor.">
<!--
  ============================================================================
  ORIGINAL WORK - AUTHORSHIP MANIFEST
  ============================================================================
  Title      : COLD READ, gender inference curves. Plate 02.
  Author     : Zaid Ali Syed
  Origin     : https://github.com/zaidwhy/coldread
  Data       : 72 authors, Blog Authorship Corpus. 504 calls per model,
               temperature 0, seed 1938. Wilson 95% intervals.
               Verbatim from coldread/RESULT.md, run 2026-08-23.
  Copyright  : (c) 2026 Zaid Ali Syed. All rights reserved.
  PGP key    : EFE9 4832 B2B9 80D9 B583  91F2 8FAA BCC1 B1AC 09E5

  These are original experimental results. The numbers plotted here were
  produced by the author's own measurement code and are reproducible from
  the repository named above. If this file appears anywhere other than
  zaidwhy/*, it was copied.

  Note: every animation here degrades gracefully. Static attribute values
  represent the finished state, so the figure is complete and correct even
  where SMIL is not played.
  ============================================================================
-->
<defs>
<clipPath id="cr-clip"><rect x="0" y="0" width="900" height="450" rx="10"/></clipPath>
</defs>

<g clip-path="url(#cr-clip)">
<rect x="0" y="0" width="900" height="450" fill="#0B0E14"/>

<!-- title -->
<text x="78" y="36" fill="#E9EEF5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" letter-spacing="1.6">THE ANONYMITY HALF-LIFE BELONGS TO THE READER</text>
<text x="78" y="57" fill="#7D8794" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5">Gender inferred from a person's own words. Same 72 authors, two readers.</text>

<!-- legend -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">
<rect x="672" y="26" width="14" height="3" fill="#22D3EE"/><text x="692" y="33" fill="#9AA5B1">llama3.1:8b</text>
<rect x="672" y="42" width="14" height="3" fill="#F59E0B"/><text x="692" y="49" fill="#9AA5B1">qwen2.5:7b</text>
<rect x="672" y="58" width="14" height="3" fill="#6B7280"/><text x="692" y="65" fill="#9AA5B1">star sign (control)</text>
</g>

<!-- y gridlines + labels -->
<g stroke="#1B2430" stroke-width="1">
<path d="M78 84H858M78 149H858M78 279H858M78 344H858"/>
</g>
<g fill="#5C6875" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" text-anchor="end">
<text x="68" y="88">100%</text><text x="68" y="153">75%</text><text x="68" y="218">50%</text><text x="68" y="283">25%</text><text x="68" y="348">0%</text>
</g>

<!-- chance line -->
<path d="M78 214H858" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="856" y="207" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" text-anchor="end">chance</text>

<!-- axes -->
<path d="M78 84V344H858" stroke="#2A3542" stroke-width="1.5" fill="none"/>

<!-- x labels -->
<g fill="#5C6875" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" text-anchor="middle">
<text x="78" y="364">25</text><text x="208" y="364">50</text><text x="338" y="364">100</text><text x="468" y="364">200</text><text x="598" y="364">400</text><text x="728" y="364">800</text><text x="858" y="364">1600</text>
</g>
<text x="468" y="384" fill="#7D8794" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" text-anchor="middle">words of the author's own text shown to the model</text>

<!-- control curve -->
<polyline points="78,322.4 208,318.8 338,322.4 468,329.4 598,318.8 728,322.4 858,322.4" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="1000" stroke-dashoffset="0">
<animate attributeName="stroke-dashoffset" from="1000" to="0" dur="1.6s" begin="0.2s" fill="freeze"/>
</polyline>

<!-- qwen curve -->
<polyline points="78,228.6 208,231.9 338,224.9 468,210.4 598,196.1 728,174.2 858,156.3" fill="none" stroke="#F59E0B" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="0">
<animate attributeName="stroke-dashoffset" from="1000" to="0" dur="1.9s" begin="0.5s" fill="freeze"/>
</polyline>

<!-- llama curve -->
<polyline points="78,188.8 208,166.9 338,159.9 468,149 598,141.7 728,127.4 858,109.2" fill="none" stroke="#22D3EE" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="0">
<animate attributeName="stroke-dashoffset" from="1000" to="0" dur="1.9s" begin="0.5s" fill="freeze"/>
</polyline>

<!-- data points -->
<g fill="#0B0E14" stroke-width="2">
<g stroke="#6B7280"><circle cx="78" cy="322.4" r="3"/><circle cx="208" cy="318.8" r="3"/><circle cx="338" cy="322.4" r="3"/><circle cx="468" cy="329.4" r="3"/><circle cx="598" cy="318.8" r="3"/><circle cx="728" cy="322.4" r="3"/><circle cx="858" cy="322.4" r="3"/></g>
<g stroke="#F59E0B"><circle cx="78" cy="228.6" r="3.6"/><circle cx="208" cy="231.9" r="3.6"/><circle cx="338" cy="224.9" r="3.6"/><circle cx="468" cy="210.4" r="3.6"/><circle cx="598" cy="196.1" r="3.6"/><circle cx="858" cy="156.3" r="3.6"/></g>
<g stroke="#22D3EE"><circle cx="78" cy="188.8" r="3.6"/><circle cx="338" cy="159.9" r="3.6"/><circle cx="468" cy="149" r="3.6"/><circle cx="598" cy="141.7" r="3.6"/><circle cx="728" cy="127.4" r="3.6"/><circle cx="858" cy="109.2" r="3.6"/></g>
</g>

<!-- half-life markers -->
<g opacity="1">
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.3s" fill="freeze"/>
<path d="M208 166.9V214" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
<circle cx="208" cy="166.9" r="7" fill="none" stroke="#22D3EE" stroke-width="2"/>
<text x="218" y="152" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">clears at 50 words</text>
<path d="M728 174.2V214" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
<circle cx="728" cy="174.2" r="7" fill="none" stroke="#F59E0B" stroke-width="2"/>
<text x="728" y="163" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">clears at 800 words</text>
</g>

<!-- finding -->
<text x="78" y="410" fill="#E9EEF5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" opacity="1">
<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.8s" fill="freeze"/>
Identical text. One reader needs 50 words to beat a coin flip. The other needs 800. A 16x gap.</text>

<!-- plate line -->
<rect x="0" y="426" width="900" height="24" fill="#070A0F"/>
<text x="78" y="442" fill="#4A5563" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2.2">PLATE 02  ·  COLD READ  ·  ORIGINAL RESEARCH OF ZAID ALI SYED  ·  n=72  ·  MMXXVI</text>
</g>
</svg>
